plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'dev.livingvillages'
version = '1.0.0-dev'
base { archivesName = 'livingvillages' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
neoForge {
    version = '21.1.262'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'livingvillages'
        }
        restartWrite {
            type = 'gameTestServer'
            gameDirectory = project.file(providers.gradleProperty('acceptanceDir').getOrElse('run-restart'))
            systemProperty 'neoforge.enabledGameTestNamespaces', 'livingvillages_restart'
            systemProperty 'livingvillages.acceptance.phase', 'write'
        }
        restartRead {
            type = 'gameTestServer'
            gameDirectory = project.file(providers.gradleProperty('acceptanceDir').getOrElse('run-restart'))
            systemProperty 'neoforge.enabledGameTestNamespaces', 'livingvillages_restart'
            systemProperty 'livingvillages.acceptance.phase', 'read'
        }
    }
    mods { livingvillages { sourceSet sourceSets.main } }
}
dependencies {
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnitPlatform() }
